<div class="card">
  <div class="image">
    @if (!isLoaded()) {
      <div
        class="skeleton"
        [ngClass]="{
          'vertical-image': isVertical(),
          'horizontal-image': !isVertical()
        }"
      ></div>
    }
    <img
      [src]="path()"
      [alt]="item().number"
      [width]="width()"
      [height]="height()"
      [class.loaded]="isLoaded()"
      [ngClass]="{
        'vertical-image': isVertical(),
        'horizontal-image': !isVertical()
      }"
      (load)="isLoaded.set(true)"
      (error)="isLoaded.set(true)"
    >
    <div class="number">
      № {{ item().number }}
    </div>
  </div>

  <div class="details">
    <div class="status">
      @if (isReadonly()) {
        <div class="readonly">
          @if (itemHas()) {
            <span>✅</span>
          } @else {
            <span>❌</span>
          }
        </div>
      } @else {
        <div class="readable">
          @if (itemHas()) {
            <div class="has" [ngClass]="{ 'active': itemHas(), 'inactive': !itemHas() }" (click)="change({ has: true })">✅</div>
          } @else {
            <div class="absent" [ngClass]="{ 'active': !itemHas(), 'inactive': itemHas()}" (click)="change({ has: false })">❌</div>
          }
        </div>
      }
    </div>
  </div>
</div>
